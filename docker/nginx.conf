server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    autoindex off;
    server_tokens off;

    # gzip_static serves the build-time .gz sibling when the client supports it;
    # gzip covers any compressible response without a precompressed sibling.
    gzip on;
    gzip_static on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types
        application/javascript
        application/json
        application/manifest+json
        application/wasm
        application/xml
        image/svg+xml
        text/css
        text/javascript
        text/plain;

    include /etc/nginx/conf.d/security-headers.conf;

    location = /healthz {
        include /etc/nginx/conf.d/security-headers.conf;
        access_log off;
        default_type text/plain;
        add_header Cache-Control "no-store" always;
        return 200 "ok\n";
    }

    # HTML is deliberately revalidated so deployments are picked up promptly.
    location = /index.html {
        include /etc/nginx/conf.d/security-headers.conf;
        try_files $uri =404;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    # Vite writes content-hashed bundles directly into /assets/ (name-<8 char
    # hash>.ext). Public route art, audio and models live in subdirectories with
    # stable unhashed names (e.g. naples-balcony-house.webp), so they must stay
    # revalidatable rather than being cached as immutable for a year.
    location ~ "^/assets/[^/]+-[A-Za-z0-9_-]{8}\.(?:css|js|mjs|map|gif|jpe?g|png|svg|webp|avif|ico|woff2?|ttf)$" {
        include /etc/nginx/conf.d/security-headers.conf;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # Meshopt-compressed 3D route models (stable names, revalidated by ETag).
    location ~* \.glb$ {
        include /etc/nginx/conf.d/security-headers.conf;
        try_files $uri =404;
        types { }
        default_type model/gltf-binary;
        add_header Cache-Control "no-cache" always;
    }

    # Keep WebAssembly's MIME type explicit even on older Nginx mime maps.
    location ~* \.wasm$ {
        include /etc/nginx/conf.d/security-headers.conf;
        try_files $uri =404;
        default_type application/wasm;
        add_header Cache-Control "no-cache" always;
    }

    # This is a static client, not an SPA route server. In particular, a typo
    # in a MediaPipe runtime/model asset must remain a 404 rather than index.html.
    location / {
        include /etc/nginx/conf.d/security-headers.conf;
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache" always;
    }
}
